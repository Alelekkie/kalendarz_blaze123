<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan zadań</title>

    <!-- iPhone -->
    <link rel="apple-touch-icon" sizes="180x180" href="plan.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Plan zadań">

    <!-- Android / PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff1493">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #111;
            color: #fff;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #000;
            gap: 10px;
        }

        header h2 {
            margin: 0;
            font-size: 20px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #addBtn {
            background: hotpink;
            color: #000;
            font-weight: bold;
            font-size: 22px;
            min-width: 48px;
        }

        #archiveBtn {
            background: #555;
            color: #fff;
        }

        .container {
            padding: 15px;
        }

        .task {
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            word-break: break-word;
            transition: transform 0.15s ease;
        }

        .task:hover {
            transform: scale(1.01);
        }

        .red {
            background: #ff3b3b;
        }

        .orange {
            background: #ff9d00;
        }

        .green {
            background: #2ecc71;
        }

        .gray {
            background: #555;
        }

        .hidden {
            display: none !important;
        }

        .empty {
            text-align: center;
            color: #aaa;
            padding: 30px 10px;
        }

        .error {
            background: #8b0000;
            color: white;
            padding: 12px;
            margin: 15px;
            border-radius: 10px;
            display: none;
        }

        .modal {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
        }

        .modal-content h3 {
            margin-top: 0;
        }

        input,
        textarea {
            width: 100%;
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid hotpink;
            background: #222;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: deeppink;
            box-shadow: 0 0 10px hotpink;
        }

        #saveBtn {
            width: 100%;
            padding: 12px 0;

            border-radius: 12px;

            color: #fff;
            font-weight: bold;

            box-shadow: 0 4px 8px rgba(255, 20, 147, 0.4);
        }

        #saveBtn:hover {
            transform: translateY(-2px);
        }

        #closeBtn {
            width: 100%;
            margin-top: 8px;

            color: white;
        }

        .loading {
            text-align: center;

            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <button id="addBtn">+</button>

    <h2>ZADANIA</h2>

    <button id="archiveBtn">Archiwum</button>
</header>

<div id="errorBox" class="error"></div>

<div class="container" id="taskList"></div>

<div class="container hidden" id="archiveList"></div>

<!-- MODAL -->
<div class="modal" id="modal">

    <div class="modal-content">

        <h3>DODAJ NOWE ZADANIE</h3>

        <input
            type="datetime-local"
            id="date"
        >

        <textarea
            id="desc"
            placeholder="Opis zadania"
        ></textarea>

        <button id="saveBtn">
            Zapisz
        </button>

        <button id="closeBtn">
            Anuluj
        </button>

    </div>

</div>

<script type="module">

    // =====================================================
    // FIREBASE
    // =====================================================

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        updateDoc,
        doc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


    const firebaseConfig = {

        apiKey: "AIzaSyAryTIyJW1pEfye1zWxwNSZZxR7fiPjQFc",

        authDomain: "kalendarz-af3d4.firebaseapp.com",

        projectId: "kalendarz-af3d4",

        storageBucket: "kalendarz-af3d4.firebasestorage.app",

        messagingSenderId: "227083875151",

        appId: "1:227083875151:web:23a7b40e43654015998b3a"
    };


    // Uruchomienie Firebase
    const app = initializeApp(firebaseConfig);

    // Uruchomienie Firestore
    const db = getFirestore(app);


    // =====================================================
    // ELEMENTY
    // =====================================================

    const taskList =
        document.getElementById("taskList");

    const archiveList =
        document.getElementById("archiveList");

    const modal =
        document.getElementById("modal");

    const dateInput =
        document.getElementById("date");

    const descInput =
        document.getElementById("desc");

    const errorBox =
        document.getElementById("errorBox");

    const addBtn =
        document.getElementById("addBtn");

    const archiveBtn =
        document.getElementById("archiveBtn");

    const saveBtn =
        document.getElementById("saveBtn");

    const closeBtn =
        document.getElementById("closeBtn");


    let showArchive = false;


    // =====================================================
    // KOMUNIKATY BŁĘDÓW
    // =====================================================

    function showError(message) {

        errorBox.textContent = message;

        errorBox.style.display = "block";

        console.error(message);
    }


    function hideError() {

        errorBox.textContent = "";

        errorBox.style.display = "none";
    }


    // =====================================================
    // MODAL
    // =====================================================

    function openModal() {

        modal.style.display = "flex";

        dateInput.focus();
    }


    function closeModal() {

        modal.style.display = "none";

        dateInput.value = "";

        descInput.value = "";
    }


    addBtn.addEventListener("click", openModal);

    closeBtn.addEventListener("click", closeModal);


    // Kliknięcie poza oknem zamyka modal
    modal.addEventListener("click", function(event) {

        if (event.target === modal) {

            closeModal();

        }

    });


    // ESC zamyka modal
    document.addEventListener("keydown", function(event) {

        if (event.key === "Escape") {

            closeModal();

        }

    });


    // =====================================================
    // FORMATOWANIE DATY
    // =====================================================

    function formatDate(date) {

        return new Date(date).toLocaleString("pl-PL", {

            dateStyle: "medium",

            timeStyle: "short"

        });

    }


    // =====================================================
    // TWORZENIE ELEMENTU ZADANIA
    // =====================================================

    function createTaskElement(task, archived = false) {

        const el = document.createElement("div");

        el.classList.add("task");

        if (archived) {

            el.classList.add("gray");

        }


        const dateElement =
            document.createElement("b");

        dateElement.textContent =
            formatDate(task.date);


        const br =
            document.createElement("br");


        const descElement =
            document.createElement("span");

        descElement.textContent =
            archived
                ? task.desc
                : task.desc.substring(0, 50);


        el.appendChild(dateElement);

        el.appendChild(br);

        el.appendChild(descElement);


        // Kliknięcie pokazuje cały opis
        el.addEventListener("click", function() {

            alert(
                formatDate(task.date)
                + "\n\n"
                + task.desc
            );

        });


        return el;
    }


    // =====================================================
    // POBIERANIE I WYŚWIETLANIE ZADAŃ
    // =====================================================

    async function render() {

        try {

            hideError();

            taskList.innerHTML =
                '<div class="loading">Ładowanie...</div>';


            const snapshot =
                await getDocs(
                    collection(db, "tasks")
                );


            const tasks =
                snapshot.docs.map(function(item) {

                    return {

                        id: item.id,

                        ...item.data()

                    };

                });


            const now = new Date();


            const active = [];

            const archive = [];


            // -------------------------------------------------
            // Sprawdzenie, które zadania są zakończone
            // -------------------------------------------------

            for (const task of tasks) {

                const taskDate =
                    new Date(task.date);


                // Jeżeli termin minął,
                // przenosimy zadanie do archiwum

                if (
                    taskDate < now &&
                    !task.done
                ) {

                    try {

                        await updateDoc(
                            doc(db, "tasks", task.id),
                            {
                                done: true
                            }
                        );

                        task.done = true;

                    } catch (error) {

                        console.error(
                            "Nie udało się zarchiwizować:",
                            error
                        );

                    }

                }


                if (task.done === true) {

                    archive.push(task);

                } else {

                    active.push(task);

                }

            }


            // =================================================
            // SORTOWANIE
            // =================================================

            active.sort(function(a, b) {

                return (
                    new Date(a.date)
                    -
                    new Date(b.date)
                );

            });


            archive.sort(function(a, b) {

                return (
                    new Date(b.date)
                    -
                    new Date(a.date)
                );

            });


            // =================================================
            // KOLORY
            // =================================================

            const upcoming7 =
                active.filter(function(task) {

                    const d =
                        new Date(task.date);

                    const today =
                        new Date();

                    const sevenDaysLater =
                        new Date();

                    sevenDaysLater.setDate(
                        today.getDate() + 7
                    );

                    return (
                        d >= today &&
                        d <= sevenDaysLater
                    );

                });


            // =================================================
            // AKTYWNE ZADANIA
            // =================================================

            taskList.innerHTML = "";


            if (active.length === 0) {

                taskList.innerHTML =
                    '<div class="empty">Brak aktywnych zadań</div>';

            }


            active.forEach(function(task) {

                const el =
                    createTaskElement(task);


                const index =
                    upcoming7.indexOf(task);


                if (index !== -1) {

                    if (index < 3) {

                        el.classList.add("red");

                    } else if (index < 7) {

                        el.classList.add("orange");

                    } else {

                        el.classList.add("green");

                    }

                } else {

                    el.classList.add("green");

                }


                taskList.appendChild(el);

            });


            // =================================================
            // ARCHIWUM
            // =================================================

            archiveList.innerHTML = "";


            if (archive.length === 0) {

                archiveList.innerHTML =
                    '<div class="empty">Archiwum jest puste</div>';

            }


            archive.forEach(function(task) {

                const el =
                    createTaskElement(task, true);

                archiveList.appendChild(el);

            });


            archiveList.classList.toggle(
                "hidden",
                !showArchive
            );

        } catch (error) {

            console.error(
                "Błąd Firebase:",
                error
            );


            taskList.innerHTML = "";


            showError(
                "Nie udało się pobrać zadań z Firebase. " +
                "Sprawdź reguły Firestore oraz konfigurację Firebase."
            );

        }

    }


    // =====================================================
    // DODAWANIE ZADANIA
    // =====================================================

    saveBtn.addEventListener(
        "click",
        async function() {

            const date =
                dateInput.value;

            const desc =
                descInput.value.trim();


            if (!date) {

                alert(
                    "Wybierz datę i godzinę."
                );

                return;

            }


            if (!desc) {

                alert(
                    "Wpisz opis zadania."
                );

                return;

            }


            try {

                hideError();


                saveBtn.disabled = true;

                saveBtn.textContent =
                    "Zapisywanie...";


                await addDoc(
                    collection(db, "tasks"),
                    {

                        date: date,

                        desc: desc,

                        done: false,

                        createdAt:
                            new Date().toISOString()

                    }
                );


                closeModal();


                await render();


            } catch (error) {

                console.error(
                    "Błąd podczas zapisywania:",
                    error
                );


                showError(
                    "Nie udało się zapisać zadania w Firebase. " +
                    "Najprawdopodobniej problemem są reguły Firestore."
                );


                alert(
                    "Błąd zapisu do Firebase.\n\n" +
                    error.message
                );

            } finally {

                saveBtn.disabled = false;

                saveBtn.textContent =
                    "Zapisz";

            }

        }
    );


    // =====================================================
    // ARCHIWUM
    // =====================================================

    archiveBtn.addEventListener(
        "click",
        function() {

            showArchive =
                !showArchive;


            archiveList.classList.toggle(
                "hidden",
                !showArchive
            );


            archiveBtn.textContent =
                showArchive
                    ? "Ukryj archiwum"
                    : "Archiwum";

        }
    );


    // =====================================================
    // START
    // =====================================================

    render();


    // Odświeżenie co 5 sekund
    setInterval(
        render,
        5000
    );

</script>

</body>
</html>
