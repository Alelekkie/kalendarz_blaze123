
<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZADANIA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    header {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 15px;
      background: #000;
      gap: 10px;
      min-height: 70px;
    }

    header h2 {
      margin: 0;
      font-size: 20px;
      text-align: center;
      white-space: nowrap;
      grid-column: 2;
    }

    #addBtn {
      justify-self: start;
      min-width: 48px;
      height: 42px;
      border: none;
      border-radius: 6px;
      background: hotpink;
      color: #000;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      grid-column: 1;
      grid-row: 1;
    }

    #archiveBtn {
      justify-self: end;
      min-width: 95px;
      height: 40px;
      padding: 0 12px;
      border: none;
      border-radius: 6px;
      background: #555;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
      grid-column: 3;
      grid-row: 1;
    }

    button {
      transition: opacity 0.15s ease;
    }

    button:hover {
      opacity: 0.85;
    }

    button:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    main {
      padding: 15px;
      max-width: 900px;
      margin: 0 auto;
    }

    #sectionTitle {
      margin: 5px 0 15px;
      font-size: 17px;
      color: #ccc;
    }

    #taskList {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task {
      padding: 16px;
      border-radius: 8px;
      color: #fff;
      overflow-wrap: anywhere;
    }

    .task.red {
      background: #8f2525;
    }

    .task.orange {
      background: #9b5a16;
    }

    .task.green {
      background: #216b3b;
    }

    .task.archived {
      background: #383838;
      opacity: 0.85;
    }

    .task-date {
      margin-bottom: 8px;
      font-size: 13px;
      opacity: 0.85;
    }

    .task-description {
      font-size: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .task-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
    }

    .task-actions button {
      padding: 8px 12px;
      border: none;
      border-radius: 5px;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      cursor: pointer;
    }

    .empty-message {
      padding: 20px 5px;
      color: #888;
      text-align: center;
    }

    /* Okno dodawania zadania */
    #modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(0, 0, 0, 0.8);
    }

    #modal.open {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 450px;
      padding: 22px;
      border: 1px solid #333;
      border-radius: 10px;
      background: #1b1b1b;
    }

    .modal-content h3 {
      margin: 0 0 20px;
      font-size: 20px;
    }

    .modal-content label {
      display: block;
      margin: 0 0 8px;
      color: #ddd;
      font-size: 14px;
    }

    .modal-content input,
    .modal-content textarea {
      display: block;
      width: 100%;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid #444;
      border-radius: 6px;
      outline: none;
      background: #292929;
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 15px;
    }

    .modal-content input:focus,
    .modal-content textarea:focus {
      border-color: hotpink;
    }

    .modal-content textarea {
      min-height: 120px;
      resize: vertical;
    }

    .modal-buttons {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .modal-buttons button {
      flex: 1;
      min-height: 42px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    #saveBtn {
      background: hotpink;
      color: #000;
      font-weight: bold;
    }

    #cancelBtn {
      background: #444;
      color: #fff;
    }

    #statusMessage {
      min-height: 18px;
      margin-top: 12px;
      color: #ff7777;
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    @media (max-width: 380px) {
      header {
        padding: 12px 10px;
        gap: 6px;
      }

      header h2 {
        font-size: 17px;
      }

      #addBtn {
        min-width: 42px;
      }

      #archiveBtn {
        min-width: 82px;
        padding: 0 8px;
        font-size: 12px;
      }

      main {
        padding: 12px;
      }
    }
  </style>
</head>

<body>
  <header>
    <button id="addBtn" type="button" aria-label="Dodaj zadanie">+</button>
    <h2>ZADANIA</h2>
    <button id="archiveBtn" type="button">Archiwum</button>
  </header>

  <main>
    <h3 id="sectionTitle">Aktywne zadania</h3>
    <div id="taskList"></div>
  </main>

  <div id="modal" aria-hidden="true">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h3 id="modalTitle">Dodaj zadanie</h3>

      <form id="taskForm">
        <label for="taskDate">Data zadania</label>
        <input id="taskDate" type="date" required>

        <label for="taskDescription">Opis zadania</label>
        <textarea
          id="taskDescription"
          placeholder="Wpisz opis zadania..."
          required
        ></textarea>

        <div class="modal-buttons">
          <button id="saveBtn" type="submit">Zapisz</button>
          <button id="cancelBtn" type="button">Anuluj</button>
        </div>

        <div id="statusMessage" role="status"></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getFirestore,
      collection,
      addDoc,
      onSnapshot,
      updateDoc,
      doc,
      serverTimestamp
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAryTIyJW1pEfye1zWxwNSZZxR7fiPjQFc",
      authDomain: "kalendarz-af3d4.firebaseapp.com",
      projectId: "kalendarz-af3d4",
      storageBucket: "kalendarz-af3d4.firebasestorage.app",
      messagingSenderId: "227083875151",
      appId: "1:227083875151:web:23a7b40e43654015998b3a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const tasksCollection = collection(db, "tasks");

    const addBtn = document.getElementById("addBtn");
    const archiveBtn = document.getElementById("archiveBtn");
    const modal = document.getElementById("modal");
    const taskForm = document.getElementById("taskForm");
    const taskDate = document.getElementById("taskDate");
    const taskDescription = document.getElementById("taskDescription");
    const saveBtn = document.getElementById("saveBtn");
    const cancelBtn = document.getElementById("cancelBtn");
    const taskList = document.getElementById("taskList");
    const sectionTitle = document.getElementById("sectionTitle");
    const statusMessage = document.getElementById("statusMessage");

    let showingArchive = false;
    let allTasks = [];
    let saving = false;
    let archiveUpdatesInProgress = new Set();

    function getTodayString() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const day = String(now.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function formatDate(dateString) {
      if (!dateString) return "Brak daty";

      const parts = dateString.split("-");
      if (parts.length !== 3) return dateString;

      return `${parts[2]}.${parts[1]}.${parts[0]}`;
    }

    function isArchived(task) {
      return task.archived === true;
    }

    function getTaskColor(task) {
      if (!task.date) return "orange";

      const today = getTodayString();

      if (task.date < today) return "red";
      if (task.date === today) return "orange";
      return "green";
    }

    function setStatus(message, isError = true) {
      statusMessage.textContent = message;
      statusMessage.style.color = isError ? "#ff7777" : "#7ee59b";
    }

    function openModal() {
      taskForm.reset();
      taskDate.value = getTodayString();
      setStatus("");
      modal.classList.add("open");
      modal.setAttribute("aria-hidden", "false");
      taskDescription.focus();
    }

    function closeModal() {
      modal.classList.remove("open");
      modal.setAttribute("aria-hidden", "true");
      setStatus("");
    }

    addBtn.addEventListener("click", openModal);
    cancelBtn.addEventListener("click", closeModal);

    modal.addEventListener("click", (event) => {
      if (event.target === modal && !saving) {
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && modal.classList.contains("open") && !saving) {
        closeModal();
      }
    });

    archiveBtn.addEventListener("click", () => {
      showingArchive = !showingArchive;

      archiveBtn.textContent = showingArchive ? "Powrót" : "Archiwum";

      sectionTitle.textContent = showingArchive
        ? "Archiwum"
        : "Aktywne zadania";

      // Nagłówek ma stały układ grid, więc tytuł ZADANIA nie przesuwa się.
      renderTasks();
    });

    taskForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (saving) return;

      const date = taskDate.value;
      const description = taskDescription.value.trim();

      if (!date) {
        setStatus("Wybierz datę zadania.");
        taskDate.focus();
        return;
      }

      if (!description) {
        setStatus("Wpisz opis zadania.");
        taskDescription.focus();
        return;
      }

      saving = true;
      saveBtn.disabled = true;
      cancelBtn.disabled = true;
      saveBtn.textContent = "Zapisywanie...";
      setStatus("", false);

      try {
        await addDoc(tasksCollection, {
          date,
          description,
          archived: date < getTodayString(),
          createdAt: serverTimestamp()
        });

        closeModal();
      } catch (error) {
        console.error("Błąd zapisywania zadania:", error);

        if (error.code === "permission-denied") {
          setStatus("Brak uprawnień do zapisu w Firebase. Sprawdź reguły Firestore.");
        } else {
          setStatus("Nie udało się zapisać zadania. Sprawdź połączenie i spróbuj ponownie.");
        }
      } finally {
        saving = false;
        saveBtn.disabled = false;
        cancelBtn.disabled = false;
        saveBtn.textContent = "Zapisz";
      }
    });

    function createTaskElement(task) {
      const card = document.createElement("div");
      const archived = isArchived(task);

      card.className = `task ${archived ? "archived" : getTaskColor(task)}`;

      const dateElement = document.createElement("div");
      dateElement.className = "task-date";
      dateElement.textContent = `Data: ${formatDate(task.date)}`;

      const descriptionElement = document.createElement("div");
      descriptionElement.className = "task-description";
      descriptionElement.textContent = task.description || "";

      card.append(dateElement, descriptionElement);

      const actions = document.createElement("div");
      actions.className = "task-actions";

      const archiveTaskBtn = document.createElement("button");
      archiveTaskBtn.type = "button";
      archiveTaskBtn.textContent = archived
        ? "Przywróć"
        : "Przenieś do archiwum";

      archiveTaskBtn.addEventListener("click", async () => {
        if (archiveUpdatesInProgress.has(task.id)) return;

        archiveUpdatesInProgress.add(task.id);
        archiveTaskBtn.disabled = true;

        try {
          await updateDoc(doc(db, "tasks", task.id), {
            archived: !archived
          });
        } catch (error) {
          console.error("Błąd aktualizacji zadania:", error);
          alert("Nie udało się zmienić zadania. Sprawdź reguły Firestore.");
        } finally {
          archiveUpdatesInProgress.delete(task.id);
          archiveTaskBtn.disabled = false;
        }
      });

      actions.appendChild(archiveTaskBtn);
      card.appendChild(actions);

      return card;
    }

    function renderTasks() {
      // Budujemy listę poza widokiem i podmieniamy ją za jednym razem,
      // żeby uniknąć migania podczas aktualizacji.
      const fragment = document.createDocumentFragment();

      const filteredTasks = allTasks
        .filter(task => showingArchive ? isArchived(task) : !isArchived(task))
        .sort((a, b) => {
          const dateA = a.date || "";
          const dateB = b.date || "";
          return dateA.localeCompare(dateB);
        });

      if (filteredTasks.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty-message";
        empty.textContent = showingArchive
          ? "Archiwum jest puste."
          : "Brak aktywnych zadań. Kliknij +, aby dodać zadanie.";

        fragment.appendChild(empty);
      } else {
        filteredTasks.forEach(task => {
          fragment.appendChild(createTaskElement(task));
        });
      }

      taskList.replaceChildren(fragment);
    }

    // Automatyczne, bieżące aktualizowanie listy bez odświeżania strony.
    onSnapshot(tasksCollection, async (snapshot) => {
      allTasks = snapshot.docs.map(documentSnapshot => ({
        id: documentSnapshot.id,
        ...documentSnapshot.data()
      }));

      renderTasks();

      // Zadania z przeszłą datą przenosimy do archiwum.
      const today = getTodayString();

      for (const task of allTasks) {
        if (
          task.date &&
          task.date < today &&
          task.archived !== true &&
          !archiveUpdatesInProgress.has(task.id)
        ) {
          archiveUpdatesInProgress.add(task.id);

          updateDoc(doc(db, "tasks", task.id), {
            archived: true
          })
            .catch(error => {
              console.error("Nie udało się zarchiwizować zadania:", error);
            })
            .finally(() => {
              archiveUpdatesInProgress.delete(task.id);
            });
        }
      }
    }, (error) => {
      console.error("Błąd pobierania zadań:", error);

      taskList.replaceChildren();

      const errorMessage = document.createElement("div");
      errorMessage.className = "empty-message";
      errorMessage.textContent = error.code === "permission-denied"
        ? "Brak dostępu do zadań. Sprawdź reguły Firestore."
        : "Nie udało się pobrać zadań. Sprawdź połączenie z internetem.";

      taskList.appendChild(errorMessage);
    });
  </script>
</body>
</html>
