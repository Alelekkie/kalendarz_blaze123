<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Plan zadań</title>

    <!-- iPhone -->
    <link rel="apple-touch-icon" sizes="180x180" href="plan.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Plan zadań">

    <!-- Android / PWA -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#ff1493">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #111;
            color: #fff;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px;
            background: #000;
            gap: 10px;
        }

        header h2 {
            margin: 0;
            font-size: 20px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #addBtn {
            background: hotpink;
            color: #000;
            font-weight: bold;
            font-size: 22px;
            min-width: 48px;
        }

        #archiveBtn {
            background: #555;
            color: #fff;
        }

        .container {
            padding: 15px;
        }

        .task {
            padding: 14px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            word-break: break-word;
            transition: transform 0.15s ease;
        }

        .task:hover {
            transform: scale(1.01);
        }

        .red {
            background: #ff3b3b;
        }

        .orange {
            background: #ff9d00;
        }

        .green {
            background: #2ecc71;
        }

        .gray {
            background: #555;
        }

        .hidden {
            display: none !important;
        }

        .empty {
            text-align: center;
            color: #aaa;
            padding: 30px 10px;
        }

        .error {
            background: #8b0000;
            color: white;
            padding: 12px;
            margin: 15px;
            border-radius: 10px;
            display: none;
            white-space: pre-line;
            overflow-wrap: anywhere;
        }

        .modal {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: #222;
            padding: 20px;
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            box-shadow: 0 4px 15px rgba(255, 20, 147, 0.4);
        }

        .modal-content h3 {
            margin-top: 0;
        }

        input,
        textarea {
            width: 100%;
            margin-bottom: 12px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 2px solid hotpink;
            background: #222;
            color: #fff;
            font-size: 16px;
            transition: all 0.3s ease;
            font-family: Arial, sans-serif;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: deeppink;
            box-shadow: 0 0 10px hotpink;
        }

        #saveBtn {
            width: 100%;
            padding: 12px 0;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, hotpink, deeppink);
            color: #fff;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(255, 20, 147, 0.4);
        }

        #saveBtn:hover {
            transform: translateY(-2px);
        }

        #saveBtn:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #closeBtn {
            width: 100%;
            margin-top: 8px;
            background: #555;
            color: white;
        }

        .loading {
            text-align: center;
            color: #aaa;
            padding: 30px;
        }
    </style>
</head>

<body>

<header>
    <button id="addBtn">+</button>

    <h2>ZADANIA</h2>

    <button id="archiveBtn">Archiwum</button>
</header>

<div id="errorBox" class="error"></div>

<div class="container" id="taskList"></div>

<div class="container hidden" id="archiveList"></div>

<!-- OKNO DODAWANIA ZADANIA -->
<div class="modal" id="modal">

    <div class="modal-content">

        <h3>DODAJ NOWE ZADANIE</h3>

        <input
            type="datetime-local"
            id="date"
        >

        <textarea
            id="desc"
            placeholder="Opis zadania"
        ></textarea>

        <button id="saveBtn">
            Zapisz
        </button>

        <button id="closeBtn">
            Anuluj
        </button>

    </div>

</div>

<script type="module">

    // =====================================================
    // FIREBASE
    // =====================================================

    import { initializeApp }
        from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

    import {
        getFirestore,
        collection,
        addDoc,
        getDocs,
        updateDoc,
        doc
    } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


    const firebaseConfig = {
        apiKey: "AIzaSyAryTIyJW1pEfye1zWxwNSZZxR7fiPjQFc",
        authDomain: "kalendarz-af3d4.firebaseapp.com",
        projectId: "kalendarz-af3d4",
        storageBucket: "kalendarz-af3d4.firebasestorage.app",
        messagingSenderId: "227083875151",
        appId: "1:227083875151:web:23a7b40e43654015998b3a"
    };


    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);


    // =====================================================
    // ELEMENTY STRONY
    // =====================================================

    const taskList = document.getElementById("taskList");
    const archiveList = document.getElementById("archiveList");
    const modal = document.getElementById("modal");
    const dateInput = document.getElementById("date");
    const descInput = document.getElementById("desc");
    const errorBox = document.getElementById("errorBox");
    const addBtn = document.getElementById("addBtn");
    const archiveBtn = document.getElementById("archiveBtn");
    const saveBtn = document.getElementById("saveBtn");
    const closeBtn = document.getElementById("closeBtn");

    let showArchive = false;
    let isRendering = false;


    // =====================================================
    // OBSŁUGA BŁĘDÓW
    // =====================================================

    function showError(message) {
        errorBox.textContent = message;
        errorBox.style.display = "block";
        console.error(message);
    }

    function showFirebaseError(context, error) {
        console.error(context, error);

        showError(
            context + "\n" +
            "Kod: " + (error.code || "brak kodu") + "\n" +
            "Szczegóły: " + (error.message || String(error))
        );
    }

    function hideError() {
        errorBox.textContent = "";
        errorBox.style.display = "none";
    }


    // =====================================================
    // OKNO DODAWANIA ZADANIA
    // =====================================================

    function openModal() {
        modal.style.display = "flex";
        dateInput.focus();
    }

    function closeModal() {
        modal.style.display = "none";
        dateInput.value = "";
        descInput.value = "";
    }

    addBtn.addEventListener("click", openModal);
    closeBtn.addEventListener("click", closeModal);

    modal.addEventListener("click", function(event) {
        if (event.target === modal) {
            closeModal();
        }
    });

    document.addEventListener("keydown", function(event) {
        if (event.key === "Escape") {
            closeModal();
        }
    });


    // =====================================================
    // FORMATOWANIE DATY
    // =====================================================

    function formatDate(date) {
        const parsedDate = new Date(date);

        if (Number.isNaN(parsedDate.getTime())) {
            return "Nieprawidłowa data";
        }

        return parsedDate.toLocaleString("pl-PL", {
            dateStyle: "medium",
            timeStyle: "short"
        });
    }


    // =====================================================
    // TWORZENIE ELEMENTU ZADANIA
    // =====================================================

    function createTaskElement(task, archived = false) {
        const el = document.createElement("div");
        el.classList.add("task");

        if (archived) {
            el.classList.add("gray");
        }

        const dateElement = document.createElement("b");
        dateElement.textContent = formatDate(task.date);

        const br = document.createElement("br");

        const descElement = document.createElement("span");

        const description = String(task.desc || "");

        descElement.textContent = archived
            ? description
            : description.substring(0, 50);

        el.appendChild(dateElement);
        el.appendChild(br);
        el.appendChild(descElement);

        // Kliknięcie pokazuje cały opis zadania
        el.addEventListener("click", function() {
            alert(
                formatDate(task.date) +
                "\n\n" +
                description
            );
        });

        return el;
    }


    // =====================================================
    // POBIERANIE I WYŚWIETLANIE ZADAŃ
    // =====================================================

    async function render() {

        // Zapobiega nakładaniu się kilku odświeżeń naraz
        if (isRendering) {
            return;
        }

        isRendering = true;

        try {
            hideError();

            taskList.innerHTML =
                '<div class="loading">Ładowanie...</div>';

            const snapshot = await getDocs(
                collection(db, "tasks")
            );

            const tasks = snapshot.docs.map(function(item) {
                return {
                    id: item.id,
                    ...item.data()
                };
            });

            const now = new Date();

            const active = [];
            const archive = [];

            // -------------------------------------------------
            // ARCHIWIZACJA ZADAŃ, KTÓRYCH TERMIN MINĄŁ
            // -------------------------------------------------

            for (const task of tasks) {

                const taskDate = new Date(task.date);

                if (
                    !task.done &&
                    !Number.isNaN(taskDate.getTime()) &&
                    taskDate < now
                ) {

                    try {
                        await updateDoc(
                            doc(db, "tasks", task.id),
                            {
                                done: true
                            }
                        );

                        task.done = true;

                    } catch (error) {
                        // Jeśli zapis archiwizacji się nie uda,
                        // pokazujemy błąd zamiast go ukrywać.
                        console.error(
                            "Nie udało się zarchiwizować zadania:",
                            error
                        );
                    }
                }

                if (task.done === true) {
                    archive.push(task);
                } else {
                    active.push(task);
                }
            }


            // =================================================
            // SORTOWANIE ZADAŃ
            // =================================================

            active.sort(function(a, b) {
                return new Date(a.date) - new Date(b.date);
            });

            archive.sort(function(a, b) {
                return new Date(b.date) - new Date(a.date);
            });


            // =================================================
            // KOLORY ZADAŃ
            // =================================================

            const upcoming7 = active.filter(function(task) {
                const d = new Date(task.date);
                const today = new Date();
                const sevenDaysLater = new Date();

                sevenDaysLater.setDate(
                    today.getDate() + 7
                );

                return d >= today && d <= sevenDaysLater;
            });


            // =================================================
            // WYŚWIETLANIE AKTYWNYCH ZADAŃ
            // =================================================

            taskList.innerHTML = "";

            if (active.length === 0) {
                taskList.innerHTML =
                    '<div class="empty">Brak aktywnych zadań</div>';
            }

            active.forEach(function(task) {

                const el = createTaskElement(task);

                const index = upcoming7.indexOf(task);

                if (index !== -1) {

                    if (index < 3) {
                        el.classList.add("red");
                    } else if (index < 7) {
                        el.classList.add("orange");
                    } else {
                        el.classList.add("green");
                    }

                } else {
                    el.classList.add("green");
                }

                taskList.appendChild(el);
            });


            // =================================================
            // WYŚWIETLANIE ARCHIWUM
            // =================================================

            archiveList.innerHTML = "";

            if (archive.length === 0) {
                archiveList.innerHTML =
                    '<div class="empty">Archiwum jest puste</div>';
            }

            archive.forEach(function(task) {
                const el = createTaskElement(task, true);
                archiveList.appendChild(el);
            });

            archiveList.classList.toggle(
                "hidden",
                !showArchive
            );

        } catch (error) {

            taskList.innerHTML = "";

            showFirebaseError(
                "Nie udało się pobrać zadań z Firebase.",
                error
            );

        } finally {
            isRendering = false;
        }
    }


    // =====================================================
    // DODAWANIE NOWEGO ZADANIA
    // =====================================================

    saveBtn.addEventListener("click", async function() {

        const date = dateInput.value;
        const desc = descInput.value.trim();

        if (!date) {
            alert("Wybierz datę i godzinę.");
            return;
        }

        if (!desc) {
            alert("Wpisz opis zadania.");
            return;
        }

        saveBtn.disabled = true;
        saveBtn.textContent = "Zapisywanie...";

        try {

            hideError();

            await addDoc(
                collection(db, "tasks"),
                {
                    date: date,
                    desc: desc,
                    done: false,
                    createdAt: new Date().toISOString()
                }
            );

            closeModal();

            await render();

        } catch (error) {

            showFirebaseError(
                "Nie udało się zapisać zadania w Firebase.",
                error
            );

            alert(
                "Nie udało się zapisać zadania.\n\n" +
                "Kod: " + (error.code || "brak kodu") +
                "\nSzczegóły: " + (error.message || String(error))
            );

        } finally {

            saveBtn.disabled = false;
            saveBtn.textContent = "Zapisz";

        }
    });


    // =====================================================
    // PRZYCISK ARCHIWUM
    // =====================================================

    archiveBtn.addEventListener("click", function() {

        showArchive = !showArchive;

        archiveList.classList.toggle(
            "hidden",
            !showArchive
        );

        archiveBtn.textContent = showArchive
            ? "Ukryj archiwum"
            : "Archiwum";
    });


    // =====================================================
    // START APLIKACJI
    // =====================================================

    render();

    // Odświeżanie listy co 5 sekund
    setInterval(function() {
        render();
    }, 5000);

</script>

</body>
</html>
